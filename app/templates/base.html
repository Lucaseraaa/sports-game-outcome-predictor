<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sport Predictor{% endblock %}</title>

    <!--Carichiamo Tailwind CSS per lo stile moderno e FontAwesome per le icone-->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gray-900 text-gray-100 font-sans flex flex-col min-h-screen">

    <!--NavBar-->
    <nav class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0 text-emerald-400 text-2xl font-black tracking-wider">
                        <i class="fa-solid fa-chart-line mr-2"></i>FOOTBALL <span class="text-white">PREDICTOR</span>
                    </div>
                    <div class="hidden md:block">
                        <div class="ml-10 flex items-baseline space-x-4">
                            <a href="{{ url_for('home') }}" class="bg-gray-900 text-white px-3 py-2 rounded-md text-sm font-medium">Home</a>
                            <a href="{{ url_for('bet') }}" class="text-gray-300 hover:bg-gray-750 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition">Bet Simulator</a>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </nav>

    <!-- Contenuto Principale Dinamico -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-950 border-t border-gray-800 py-6 text-center text-sm text-gray-500">
        <p>&copy; Sport Predictor AI App</p>
    </footer>

</body>
</html>
